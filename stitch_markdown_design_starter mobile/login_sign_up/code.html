<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quizzer - Login / Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#004ac6",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface-variant": "#434655",
                        "secondary-container": "#dedfe3",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e6e7f4",
                        "status-destructive": "#DC2626",
                        "surface-dim": "#d8d9e6",
                        "status-warning": "#F59E0B",
                        "primary-container": "#2563eb",
                        "tertiary-fixed": "#ffdbcd",
                        "inverse-primary": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "surface": "#faf8ff",
                        "status-success": "#16A34A",
                        "on-primary-fixed-variant": "#003ea8",
                        "text-muted": "#6B7280",
                        "surface-bright": "#faf8ff",
                        "inverse-surface": "#2d303a",
                        "on-secondary": "#ffffff",
                        "on-background": "#181b24",
                        "border-hairline": "#DCDFE6",
                        "on-primary-container": "#eeefff",
                        "surface-variant": "#e0e2ef",
                        "outline-variant": "#c3c6d7",
                        "outline": "#737686",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#191c1f",
                        "surface-container-low": "#f2f3ff",
                        "tertiary": "#943700",
                        "on-primary-fixed": "#00174b",
                        "surface-container-highest": "#e0e2ef",
                        "white": "#FFFFFF",
                        "background": "#faf8ff",
                        "error-container": "#ffdad6",
                        "on-surface": "#181b24",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary-fixed": "#360f00",
                        "secondary-fixed": "#e1e2e6",
                        "on-error": "#ffffff",
                        "surface-tint": "#0053db",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-secondary-fixed-variant": "#44474a",
                        "secondary": "#5c5e62",
                        "surface-container": "#ecedfa",
                        "secondary-fixed-dim": "#c5c6ca",
                        "primary-fixed": "#dbe1ff",
                        "inverse-on-surface": "#eff0fd",
                        "on-secondary-container": "#606366",
                        "tertiary-container": "#bc4800"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "0.5rem",
                        "tap-target-min": "44px",
                        "top-bar-height": "56px",
                        "gutter-md": "1rem",
                        "margin-mobile": "1rem",
                        "stack-md": "0.75rem"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display-hindi": ["Noto Sans Devanagari"],
                        "label-md": ["Inter"],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col font-body-md antialiased overflow-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-12 pb-[100px] flex flex-col max-w-md mx-auto w-full">
<!-- Header / Logo -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="w-20 h-20 bg-primary-container/10 rounded-full flex items-center justify-center mb-4 text-primary-container">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-center">Quizzer</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Your high-stakes exam companion.</p>
</div>
<!-- Segmented Control -->
<div class="flex bg-surface-container-low p-1 rounded-lg mb-8 relative">
<button class="flex-1 py-2 font-label-md text-label-md text-center rounded bg-surface shadow-sm text-primary transition-all z-10" id="tab-signin">
                Sign In
            </button>
<button class="flex-1 py-2 font-label-md text-label-md text-center rounded text-on-surface-variant hover:text-on-surface transition-all z-10" id="tab-signup">
                Sign Up
            </button>
<!-- Animated background pill (optional enhancement) -->
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-surface rounded shadow-sm transition-transform duration-300 ease-in-out hidden pointer-events-none" id="tab-indicator"></div>
</div>
<!-- Form Container -->
<div class="flex-1 flex flex-col" id="form-container">
<!-- Sign In Form -->
<form class="flex flex-col gap-stack-md flex-1" id="form-signin">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full h-tap-target-min pl-10 pr-3 rounded-lg border border-border-hairline bg-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" placeholder="Email Address" type="email"/>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full h-tap-target-min pl-10 pr-3 rounded-lg border border-border-hairline bg-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" placeholder="Password" type="password"/>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
</form>
<!-- Sign Up Form (Initially Hidden) -->
<form class="flex flex-col gap-stack-md flex-1 hidden" id="form-signup">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full h-tap-target-min pl-10 pr-3 rounded-lg border border-border-hairline bg-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" placeholder="Full Name" type="text"/>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full h-tap-target-min pl-10 pr-3 rounded-lg border border-border-hairline bg-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" placeholder="Email Address" type="email"/>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full h-tap-target-min pl-10 pr-3 rounded-lg border border-border-hairline bg-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" placeholder="Create Password" type="password"/>
</div>
</form>
</div>
</main>
<!-- Pinned Action Bottom Bar -->
<div class="fixed bottom-0 w-full bg-surface border-t border-border-hairline p-margin-mobile z-50">
<div class="max-w-md mx-auto">
<button class="w-full h-tap-target-min bg-primary-container text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-primary-container/90 active:scale-[0.98] transition-all" id="btn-submit">
                Sign In
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabSignIn = document.getElementById('tab-signin');
            const tabSignUp = document.getElementById('tab-signup');
            const formSignIn = document.getElementById('form-signin');
            const formSignUp = document.getElementById('form-signup');
            const btnSubmit = document.getElementById('btn-submit');
            
            // Simple active state toggling
            const setActiveTab = (isSignIn) => {
                if (isSignIn) {
                    // Styles for Sign In active
                    tabSignIn.classList.add('bg-surface', 'shadow-sm', 'text-primary');
                    tabSignIn.classList.remove('text-on-surface-variant');
                    
                    // Styles for Sign Up inactive
                    tabSignUp.classList.remove('bg-surface', 'shadow-sm', 'text-primary');
                    tabSignUp.classList.add('text-on-surface-variant');

                    formSignIn.classList.remove('hidden');
                    formSignUp.classList.add('hidden');
                    btnSubmit.textContent = 'Sign In';
                } else {
                     // Styles for Sign Up active
                    tabSignUp.classList.add('bg-surface', 'shadow-sm', 'text-primary');
                    tabSignUp.classList.remove('text-on-surface-variant');
                    
                    // Styles for Sign In inactive
                    tabSignIn.classList.remove('bg-surface', 'shadow-sm', 'text-primary');
                    tabSignIn.classList.add('text-on-surface-variant');

                    formSignIn.classList.add('hidden');
                    formSignUp.classList.remove('hidden');
                    btnSubmit.textContent = 'Sign Up';
                }
            };

            tabSignIn.addEventListener('click', () => setActiveTab(true));
            tabSignUp.addEventListener('click', () => setActiveTab(false));
        });
    </script>
</body></html>
