<style>

<body class="bg-surface text-on-surface font-body-md min-h-full flex flex-col antialiased selection:bg-primary-fixed">
<!-- Top Status Bar (Minimal Chrome) -->
<header class="fixed top-0 w-full h-top-bar-height z-50 bg-surface flex items-center justify-between px-margin-mobile border-b border-border-hairline">
<div class="flex items-center gap-2 text-on-surface-variant">
<button class="h-tap-target-min w-tap-target-min flex items-center justify-center -ml-2 active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-label-md text-label-md">Physics 101: Midterm</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-full border border-border-hairline">
<span class="material-symbols-outlined text-status-warning text-sm" data-icon="timer">timer</span>
<span class="font-label-md text-label-md text-on-surface font-bold tracking-widest">45:12</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-2xl mx-auto pt-top-bar-height pb-[120px] px-margin-mobile flex flex-col">
<!-- Progress / Section Indicator -->
<div class="py-stack-md flex justify-between items-end">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Section B: Kinematics</span>
<div class="flex items-center gap-2 mt-1">
<span class="bg-primary-container text-on-primary-container font-label-md text-label-md px-2 py-0.5 rounded-sm">Q. 12</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">of 50</span>
</div>
</div>
<!-- Bookmark Action -->
<button class="h-tap-target-min w-tap-target-min flex items-center justify-center text-outline active:scale-95 duration-100 bg-surface-container-low rounded-full">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
</button>
</div>
<!-- Question Card -->
<div class="bg-surface-container-lowest border border-border-hairline rounded-xl p-gutter-md shadow-sm mb-stack-md">
<p class="font-body-lg text-body-lg text-on-surface mb-6 leading-relaxed">
                A particle is moving in a circle of radius R with a constant speed v. What is its average acceleration vector over one complete revolution?
            </p>
<!-- Options (Bento-style list) -->
<div class="flex flex-col gap-stack-sm">
<!-- Option A (Unselected) -->
<button class="w-full text-left min-h-[56px] bg-surface-container-lowest border border-border-hairline rounded-lg p-3 flex items-center gap-3 active:bg-surface-container-low transition-colors group">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-container-low text-on-surface-variant font-label-md text-label-md border border-border-hairline group-hover:border-primary-fixed">
                        A
                    </div>
<span class="font-body-md text-body-md flex-1 text-on-surface-variant">
                        v² / R directed towards the center
                    </span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex-shrink-0"></div>
</button>
<!-- Option B (Selected) -->
<button class="w-full text-left min-h-[56px] bg-surface-container-lowest border-2 border-primary-container rounded-lg p-3 flex items-center gap-3 bg-primary-fixed-dim/10 group">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-primary-container text-on-primary-container font-label-md text-label-md">
                        B
                    </div>
<span class="font-body-md text-body-md flex-1 text-on-surface font-medium">
                        Zero
                    </span>
<div class="w-5 h-5 rounded-full border-2 border-primary-container bg-primary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[14px] text-white" data-icon="circle" data-weight="fill">circle</span>
</div>
</button>
<!-- Option C (Unselected) -->
<button class="w-full text-left min-h-[56px] bg-surface-container-lowest border border-border-hairline rounded-lg p-3 flex items-center gap-3 active:bg-surface-container-low transition-colors group">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-container-low text-on-surface-variant font-label-md text-label-md border border-border-hairline group-hover:border-primary-fixed">
                        C
                    </div>
<span class="font-body-md text-body-md flex-1 text-on-surface-variant">
                        2v² / πR
                    </span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex-shrink-0"></div>
</button>
<!-- Option D (Unselected) -->
<button class="w-full text-left min-h-[56px] bg-surface-container-lowest border border-border-hairline rounded-lg p-3 flex items-center gap-3 active:bg-surface-container-low transition-colors group">
<div class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded bg-surface-container-low text-on-surface-variant font-label-md text-label-md border border-border-hairline group-hover:border-primary-fixed">
                        D
                    </div>
<span class="font-body-md text-body-md flex-1 text-on-surface-variant">
                        v² / 2R
                    </span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex-shrink-0"></div>
</button>
</div>
</div>
</main>
<!-- Floating Action Button: Question Palette Trigger -->
<div class="fixed bottom-[96px] right-margin-mobile z-40">
<button class="h-tap-target-min px-4 bg-surface-container-highest border border-border-hairline rounded-full shadow-md flex items-center gap-2 text-on-surface font-label-md text-label-md active:scale-95 transition-transform" id="paletteTrigger">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
            12/50
        </button>
</div>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 w-full z-50 bg-surface border-t border-border-hairline pb-safe px-margin-mobile py-3 flex items-center gap-3">
<!-- Previous Button (Outline) -->
<button class="flex-1 h-tap-target-min border border-outline text-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 active:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="chevron_left">chevron_left</span>
            Previous
        </button>
<!-- Next Button (Solid Primary) -->
<button class="flex-1 h-tap-target-min bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 active:opacity-90 transition-opacity shadow-sm">
            Next
            <span class="material-symbols-outlined text-[18px]" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Navigation Drawer (Questions Palette Bottom Sheet Overlay - Hidden by default for this static view, but structurally present) -->
<!-- Structurally placed as requested by components list, assuming it would be toggled via JS -->
<div class="fixed inset-0 bg-inverse-surface/40 z-50 hidden flex-col justify-end" id="paletteOverlay">
<!-- Bottom Sheet container -->
<div class="bg-surface rounded-t-xl w-full shadow-md max-h-[707px] flex flex-col transform translate-y-full transition-transform duration-300 ease-in-out" id="paletteSheet">
<!-- Handle -->
<div class="w-full flex justify-center py-3">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-gutter-md pb-3 flex items-center justify-between border-b border-border-hairline">
<h2 class="font-headline-sm text-headline-sm font-bold text-primary">Question Palette</h2>
<button class="h-10 w-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant" id="closePalette">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Tabs / Legend Strip -->
<div class="px-gutter-md py-2 overflow-x-auto no-scrollbar flex items-center gap-2 bg-surface-container-low border-b border-border-hairline">
<!-- Label text array applied here as filter pills -->
<button class="flex-shrink-0 px-3 py-1.5 bg-primary-container text-on-primary-container font-bold rounded-lg font-label-sm text-label-sm flex items-center gap-1">
                    All Questions
                </button>
<button class="flex-shrink-0 px-3 py-1.5 bg-surface text-on-surface-variant border border-border-hairline rounded-lg font-label-sm text-label-sm flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-status-destructive"></div> Wrongly Answered
                </button>
<button class="flex-shrink-0 px-3 py-1.5 bg-surface text-on-surface-variant border border-border-hairline rounded-lg font-label-sm text-label-sm flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-status-warning"></div> Marked for Review
                </button>
<button class="flex-shrink-0 px-3 py-1.5 bg-surface text-on-surface-variant border border-border-hairline rounded-lg font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="bookmark">bookmark</span> Bookmarked
                </button>
</div>
<!-- Grid Content -->
<div class="p-gutter-md overflow-y-auto flex-1 grid grid-cols-5 gap-3">
<!-- Example Grid Items indicating status -->
<!-- Answered (Primary) -->
<button class="aspect-square rounded flex items-center justify-center font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm border border-primary">
                    1
                </button>
<!-- Answered -->
<button class="aspect-square rounded flex items-center justify-center font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm border border-primary">
                    2
                </button>
<!-- Marked for Review (Warning tint) -->
<button class="aspect-square rounded flex items-center justify-center font-label-md text-label-md bg-status-warning text-white shadow-sm">
                    3
                </button>
<!-- Unanswered (Surface low) -->
<button class="aspect-square rounded flex items-center justify-center font-label-md text-label-md bg-surface-container-low text-on-surface-variant border border-border-hairline">
                    4
                </button>
<!-- Unanswered -->
<button class="aspect-square rounded flex items-center justify-center font-label-md text-label-md bg-surface-container-low text-on-surface-variant border border-border-hairline">
                    5
                </button>
<!-- Current Question (Active outline) -->
<button class="aspect-square rounded flex items-center justify-center font-label-md text-label-md bg-surface text-primary border-2 border-primary-container">
                    12
                </button>
</div>
</div>
</div>
<!-- Script to handle bottom sheet interaction for demonstration -->
<script>
        const trigger = document.getElementById('paletteTrigger');
        const overlay = document.getElementById('paletteOverlay');
        const sheet = document.getElementById('paletteSheet');
        const closeBtn = document.getElementById('closePalette');

        function openPalette() {
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            // Small delay to allow display:flex to apply before translating
            setTimeout(() => {
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closePaletteAction() {
            sheet.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }, 300); // match duration-300
        }

        trigger.addEventListener('click', openPalette);
        closeBtn.addEventListener('click', closePaletteAction);
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) closePaletteAction();
        });
    </script>
</body></html>
